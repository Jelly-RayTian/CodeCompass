name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Release needs to create a GitHub Release and upload artifacts.
# `contents: write` is the minimal scope required for that.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows Installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node deps (npm ci)
        run: npm ci

      - name: Validate version alignment with tag
        if: github.ref_type == 'tag'
        run: node scripts/check-versions.mjs --tag=${{ github.ref_name }}

      - name: Validate version alignment for preflight
        if: github.ref_type != 'tag'
        run: npm run check:versions

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend test
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust test
        working-directory: src-tauri
        run: cargo test

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Build installers
        run: npm run tauri:build

      - name: Validate NSIS installer (required)
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $nsis = "src-tauri/target/release/bundle/nsis/CodeCompass_${version}_x64-setup.exe"
          if (-not (Test-Path $nsis)) {
            Write-Error "Expected NSIS installer is missing: $nsis"
            exit 1
          }
          Write-Host "NSIS: $nsis"

      - name: Validate MSI installer (required)
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msi = "src-tauri/target/release/bundle/msi/CodeCompass_${version}_x64_en-US.msi"
          if (-not (Test-Path $msi)) {
            Write-Error "Expected MSI installer is missing: $msi"
            exit 1
          }
          Write-Host "MSI: $msi"

      - name: Smoke test NSIS install, launch, and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Resolve-Path "src-tauri/target/release/bundle/nsis/CodeCompass_${version}_x64-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'CodeCompass-release-smoke'

          $install = Start-Process -FilePath $installer.Path `
            -ArgumentList @('/S', "/D=$installDir") `
            -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $application = Get-ChildItem $installDir -Filter 'CodeCompass.exe' -Recurse |
            Select-Object -First 1
          if (-not $application) {
            throw "Installed CodeCompass.exe was not found under $installDir"
          }

          $process = Start-Process -FilePath $application.FullName `
            -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Installed CodeCompass exited during the launch smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' -Recurse |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw "NSIS uninstaller was not found under $installDir"
          }

          $uninstall = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with code $($uninstall.ExitCode)"
          }

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/CodeCompass_${version}_x64-setup.exe" release-artifacts/ -ErrorAction Stop
          Copy-Item "src-tauri/target/release/bundle/msi/CodeCompass_${version}_x64_en-US.msi" release-artifacts/ -ErrorAction Stop

          $checksumLines = Get-ChildItem release-artifacts -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksumLines | Set-Content release-artifacts/SHA256SUMS.txt -Encoding ascii

          Write-Host "Artifacts:"
          Get-ChildItem release-artifacts

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          name: '${{ github.ref_name }} — CodeCompass'
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
